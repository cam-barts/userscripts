name: Auto-Increment Script Versions

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/**/*.user.js'
      - 'styles/**/*.user.css'

concurrency:
  group: version-bump-${{ github.ref }}
  cancel-in-progress: false

jobs:
  increment-versions:
    # Skip if commit message contains [skip-version] or was made by github-actions
    if: "!contains(github.event.head_commit.message, '[skip-version]') && github.event.head_commit.author.name != 'github-actions[bot]'"

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history to diff across multi-commit pushes
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Find modified scripts and increment versions
        run: |
          # Get list of modified .user.js and .user.css files. Diff against the
          # pre-push SHA so multi-commit pushes aren't missed; on a new branch
          # (before is all zeros) there's no prior state, so fall back to HEAD~1.
          BEFORE_SHA="${{ github.event.before }}"
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BEFORE_SHA="HEAD~1"
          fi
          MODIFIED_FILES=$(git diff --name-only "$BEFORE_SHA" HEAD | grep -E '\.(user\.js|user\.css)$' || true)

          if [ -z "$MODIFIED_FILES" ]; then
            echo "No user scripts or styles modified"
            exit 0
          fi

          echo "Modified files:"
          echo "$MODIFIED_FILES"

          # Process each modified file (using while loop to handle filenames with spaces)
          while IFS= read -r FILE; do
            if [ -f "$FILE" ]; then
              echo "Processing $FILE..."
              bash .github/scripts/increment-version.sh "$FILE"
            fi
          done <<< "$MODIFIED_FILES"

      - name: Check for version changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push version updates
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git add scripts/ styles/ README.md
          git commit -m "chore: auto-increment versions [skip-version]"
          # checkout pins github.sha, not the branch tip, so a queued run behind
          # another bump would otherwise push non-fast-forward and fail.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
